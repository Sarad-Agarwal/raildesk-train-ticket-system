<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Ticket · RailDesk</title>
  <link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/tickets.css">
  <link rel="stylesheet" href="../css/premium.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <!-- ============================================================
       View Ticket
       Bookings for the signed-in customer, with search, filters,
       and cancellation. Cancelled records stay in the history.
       ============================================================ -->
  <div class="app app--customer">
    <div class="sidebar-backdrop" data-sidebar-close></div>
    <aside class="sidebar" data-customer-nav aria-label="Customer"></aside>
    <div class="app__main">
      <header class="topbar">
        <button class="icon-btn" type="button" data-sidebar-toggle aria-expanded="false" aria-label="Toggle navigation">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        </button>
        <div class="topbar__title">
          <p class="eyebrow">Customer</p>
          <h1>View Ticket</h1>
        </div>
      </header>

      <main class="app__content ticket-page" id="content">
        <div class="alert alert--error" id="pageAlert" role="alert" hidden></div>
        <header class="page-header">
          <div>
            <p class="eyebrow">My tickets</p>
            <h2>View tickets</h2>
          </div>
        </header>

        <section class="stat-grid ticket-stats" aria-label="Booking summary">
          <article class="stat-card">
            <p class="stat-card__label">Total bookings</p>
            <p class="stat-card__value" id="totalBookings">0</p>
          </article>
          <article class="stat-card">
            <p class="stat-card__label">Confirmed</p>
            <p class="stat-card__value" id="confirmedBookings">0</p>
          </article>
          <article class="stat-card">
            <p class="stat-card__label">Cancelled</p>
            <p class="stat-card__value" id="cancelledBookings">0</p>
          </article>
        </section>

        <section class="card" aria-labelledby="filterTitle">
          <div class="card__header">
            <h2 class="card__title" id="filterTitle">Search and filter</h2>
          </div>
          <form class="card__body filter-bar" id="filterForm">
            <div class="field">
              <label class="field__label" for="ticketSearch">Booking ID or train</label>
              <input class="field__input" id="ticketSearch" type="search" placeholder="RD-24011 or Rajdhani">
            </div>
            <div class="field">
              <label class="field__label" for="journeyDate">Journey date</label>
              <input class="field__input" id="journeyDate" type="date">
            </div>
            <div class="field">
              <label class="field__label" for="trainFilter">Train</label>
              <select class="field__select" id="trainFilter">
                <option value="">All trains</option>
              </select>
            </div>
            <div class="field">
              <label class="field__label" for="statusFilter">Status</label>
              <select class="field__select" id="statusFilter">
                <option value="">All statuses</option>
                <option value="Confirmed">Confirmed</option>
                <option value="Cancelled">Cancelled</option>
              </select>
            </div>
            <button class="btn btn--secondary" id="resetFilters" type="button">Reset filters</button>
          </form>
        </section>

        <section id="ticketList" class="ticket-list" aria-live="polite" aria-label="Ticket list"></section>
      </main>
    </div>
  </div>

  <div class="modal" id="cancelModal" hidden>
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="cancelTitle" aria-describedby="cancelSummary">
      <h2 id="cancelTitle">Cancel this ticket?</h2>
      <p id="cancelSummary"></p>
      <p>The booking stays in your history with the status Cancelled.</p>
      <div class="modal__actions">
        <button class="btn btn--secondary" type="button" data-close-modal data-initial-focus>Keep ticket</button>
        <button class="btn btn--danger" id="confirmCancel" type="button">Confirm cancellation</button>
      </div>
    </div>
  </div>

  <script type="module" src="../js/view-tickets.js"></script>
</body>
</html>
