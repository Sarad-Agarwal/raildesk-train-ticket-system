<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home · RailDesk</title>
  <link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/premium.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <!-- ============================================================
       Customer home
       US_UI_002. Class totals, quarterly sales, and Book Ticket.
       View Ticket, Update Details, and Train Search are linked, not built here.
       ============================================================ -->
  <div class="app app--customer">
    <div class="sidebar-backdrop" data-sidebar-close></div>
    <aside class="sidebar" data-customer-nav aria-label="Customer"></aside>
    <div class="app__main">
      <header class="topbar">
        <button class="icon-btn" type="button" data-sidebar-toggle aria-expanded="false" aria-label="Toggle navigation">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        </button>
        <div class="topbar__title">
          <p class="eyebrow">Customer</p>
          <h1>Home</h1>
        </div>
      </header>

      <main class="app__content" id="content">
        <div class="alert alert--error" id="pageAlert" role="alert" hidden></div>
        <header class="page-header">
          <div>
            <p class="eyebrow">Welcome</p>
            <h2 id="welcomeName">Customer</h2>
          </div>
        </header>

        <!-- Class totals and quarterly sales for this customer. -->
        <section aria-labelledby="aggregate-title">
          <h2 class="sr-only" id="aggregate-title">Ticket and sales totals</h2>
          <div class="stat-grid" id="classStats" style="margin-bottom: 16px;"></div>
          <div class="grid-2">
            <article class="card">
              <div class="card__header"><h2 class="card__title">Tickets by class</h2></div>
              <div class="card__body">
                <div class="bar-chart" id="classChart" role="img" aria-label="Tickets booked in each class"></div>
              </div>
            </article>
            <article class="card">
              <div class="card__header"><h2 class="card__title" id="salesTitle">Sales</h2></div>
              <div class="card__body">
                <div class="column-chart" id="quarterChart" role="img" aria-label="Sales by quarter"></div>
              </div>
            </article>
          </div>
        </section>

        <!-- Book Ticket. This path goes straight to confirmation. -->
        <section class="card" style="margin-top: 24px;" aria-labelledby="book-title">
          <div class="card__header">
            <h2 class="card__title" id="book-title">Book Ticket</h2>
          </div>
          <div class="card__body">
            <form class="book-form" id="bookForm" novalidate>
              <div class="grid-2">
                <div class="field">
                  <label class="field__label" for="customerId">ID</label>
                  <input class="field__input" id="customerId" name="customerId" type="text" readonly>
                </div>
                <div class="field">
                  <label class="field__label" for="passengerName">Name</label>
                  <input class="field__input" id="passengerName" name="passengerName" type="text" autocomplete="name">
                  <p class="field__error" hidden></p>
                </div>
                <div class="field">
                  <label class="field__label" for="mobile">Mobile</label>
                  <input class="field__input" id="mobile" name="mobile" type="text" inputmode="numeric" autocomplete="tel">
                  <p class="field__error" hidden></p>
                </div>
                <div class="field">
                  <label class="field__label" for="age">Age</label>
                  <input class="field__input" id="age" name="age" type="text" inputmode="numeric">
                  <p class="field__error" hidden></p>
                </div>
                <div class="field">
                  <label class="field__label" for="journeyDate">Date</label>
                  <input class="field__input" id="journeyDate" name="journeyDate" type="date">
                  <p class="field__error" hidden></p>
                </div>
                <div class="field">
                  <label class="field__label" for="ticketCount">Number of tickets</label>
                  <input class="field__input" id="ticketCount" name="ticketCount" type="text" inputmode="numeric" value="1">
                  <p class="field__error" hidden></p>
                </div>
                <div class="field">
                  <label class="field__label" for="boardingStation">Boarding station</label>
                  <select class="field__select" id="boardingStation" name="boardingStation">
                    <option value="">Select a station</option>
                  </select>
                  <p class="field__error" hidden></p>
                </div>
                <div class="field">
                  <label class="field__label" for="destinationStation">Destination station</label>
                  <select class="field__select" id="destinationStation" name="destinationStation">
                    <option value="">Select a station</option>
                  </select>
                  <p class="field__error" hidden></p>
                </div>
                <div class="field">
                  <label class="field__label" for="category">Ticket category</label>
                  <select class="field__select" id="category" name="category">
                    <option value="">Select a category</option>
                    <option>First Class</option>
                    <option>AC Tier 1</option>
                    <option>AC Tier 2</option>
                    <option>Tatkal</option>
                  </select>
                  <p class="field__error" hidden></p>
                </div>
                <div class="field">
                  <label class="field__label" for="trainId">Trains available</label>
                  <select class="field__select" id="trainId" name="trainId" disabled>
                    <option value="">Select a train</option>
                  </select>
                  <p class="field__hint" id="trainHint">Choose the boarding station, destination, and date to see trains.</p>
                  <p class="field__error" hidden></p>
                </div>
              </div>
              <button class="btn btn--primary" type="submit">Book ticket</button>
            </form>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="../js/customer-dashboard.js"></script>
</body>
</html>
