<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking confirmation · RailDesk</title>
  <link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/premium.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <!-- ============================================================
       Confirmation for the customer home booking form.
       The search-and-seat booking path uses this page later as well.
       ============================================================ -->
  <div class="app app--customer">
    <div class="sidebar-backdrop" data-sidebar-close></div>
    <aside class="sidebar" data-customer-nav aria-label="Customer"></aside>
    <div class="app__main">
      <header class="topbar">
        <button class="icon-btn" type="button" data-sidebar-toggle aria-expanded="false" aria-label="Toggle navigation">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        </button>
        <div class="topbar__title">
          <p class="eyebrow">Customer</p>
          <h1>Booking confirmation</h1>
        </div>
      </header>
      <main class="app__content" id="content">
        <article class="card" id="missing" hidden>
          <div class="empty-state">
            <h2 class="empty-state__title">Booking not available</h2>
            <p class="empty-state__text" id="missingText">This confirmation does not match a booking on the signed-in account.</p>
            <a class="btn btn--primary" href="customer-dashboard.html">Return to home</a>
          </div>
        </article>

        <article class="card" id="confirmation" hidden>
          <div class="card__body">
            <div class="confirm-hero">
              <div>
                <p class="eyebrow">Confirmed</p>
                <h2 id="bookingId">Booking</h2>
              </div>
              <span class="badge badge--success">Confirmed</span>
            </div>
            <dl class="meta-list" id="details"></dl>
            <div class="cluster" style="margin-top: 24px;">
              <a class="btn btn--primary" href="customer-dashboard.html">Return to home</a>
            </div>
          </div>
        </article>
      </main>
    </div>
  </div>
  <script type="module" src="../js/booking-confirmation.js"></script>
</body>
</html>
