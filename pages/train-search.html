<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Train Search and Seat Availability · RailDesk</title>
  <link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/search.css">
  <link rel="stylesheet" href="../css/premium.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <!-- ============================================================
       Train Search and Seat Availability
       Origin, destination, and date search the stored timetable.
       Availability is calculated for the selected train and date.
       ============================================================ -->
  <div class="app app--customer">
    <div class="sidebar-backdrop" data-sidebar-close></div>
    <aside class="sidebar" data-customer-nav aria-label="Customer"></aside>
    <div class="app__main">
      <header class="topbar">
        <button class="icon-btn" type="button" data-sidebar-toggle aria-expanded="false" aria-label="Toggle navigation">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        </button>
        <div class="topbar__title">
          <p class="eyebrow">Customer</p>
          <h1>Train Search and Seat Availability</h1>
        </div>
      </header>

      <main class="app__content search-page" id="content">
        <div class="alert alert--error" id="pageAlert" role="alert" hidden></div>
        <header class="page-header">
          <div>
            <p class="eyebrow">Timetable</p>
            <h2>Search trains</h2>
          </div>
        </header>

        <form class="journey-search" id="searchForm" role="search" novalidate>
          <div class="journey-search__route">
            <div class="field field--station">
              <label class="field__label" for="originStation">Origin station</label>
              <div class="station-field">
                <input class="field__input" id="originStation" name="origin" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="originList" autocomplete="off" placeholder="New Delhi">
                <ul class="station-list" id="originList" role="listbox" hidden></ul>
              </div>
              <p class="field__error" hidden></p>
            </div>
            <button class="journey-search__swap" type="button" data-station-swap data-from="originStation" data-to="destinationStation" aria-label="Swap origin and destination">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 7h11M15 4l3 3-3 3M17 17H6M9 14l-3 3 3 3"></path>
              </svg>
            </button>
            <div class="field field--station">
              <label class="field__label" for="destinationStation">Destination station</label>
              <div class="station-field">
                <input class="field__input" id="destinationStation" name="destination" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="destinationList" autocomplete="off" placeholder="Howrah">
                <ul class="station-list" id="destinationList" role="listbox" hidden></ul>
              </div>
              <p class="field__error" hidden></p>
            </div>
          </div>
          <div class="field">
            <label class="field__label" for="journeyDate">Journey date</label>
            <input class="field__input" id="journeyDate" name="date" type="date">
            <p class="field__error" hidden></p>
          </div>
          <button class="btn btn--primary" id="searchTrains" type="submit">Search trains</button>
        </form>

        <article class="card" id="searchPrompt">
          <div class="empty-state">
            <h2 class="empty-state__title">Search the timetable</h2>
            <p class="empty-state__text">Choose an origin, a destination, and a journey date. Suggestions come from the station list.</p>
          </div>
        </article>

        <section id="results" hidden>
          <article class="card" id="filterCard" hidden>
            <div class="card__header">
              <h2 class="card__title">Filter results</h2>
              <p id="resultCount"></p>
            </div>
            <div class="card__body filter-bar">
              <div class="field">
                <label class="field__label" for="classFilter">Class</label>
                <select class="field__select" id="classFilter">
                  <option value="">All classes</option>
                </select>
              </div>
              <div class="field">
                <label class="field__label" for="availabilityFilter">Availability</label>
                <select class="field__select" id="availabilityFilter">
                  <option value="">All availability</option>
                  <option value="Available">Available</option>
                  <option value="Limited Seats">Limited Seats</option>
                  <option value="Waiting List">Waiting List</option>
                </select>
              </div>
              <div class="field">
                <label class="field__label" for="sortResults">Sort</label>
                <select class="field__select" id="sortResults">
                  <option value="departure">Departure time</option>
                  <option value="arrival">Arrival time</option>
                  <option value="fare">Fare</option>
                </select>
              </div>
              <button class="btn btn--secondary" id="resetFilters" type="button">Reset filters</button>
            </div>
          </article>
          <div class="search-results" id="resultList" aria-live="polite"></div>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="../js/train-search.js"></script>
</body>
</html>
